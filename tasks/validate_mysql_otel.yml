---
- name: Determine which mysql-otel flavor(s) are in scope
  ansible.builtin.set_fact:
    mysql_otel_selfhosted_targeted: "{{ 'mysql-otel' in targets }}"
    mysql_otel_rds_targeted: "{{ 'mysql-otel-rds' in targets }}"
    mysql_otel_targeted: "{{ 'mysql-otel' in targets or 'mysql-otel-rds' in targets }}"

# NR_CLI_MYSQL_INSTANCES_FILE (required by both nrdot-collector-mysql and
# nrdot-collector-mysql-rds; a YAML file listing every MySQL instance to monitor -
# host/port/login_name per entry.)
- name: Read NR_CLI_MYSQL_INSTANCES_FILE from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    mysql_otel_instances_file: "{{ item.NR_CLI_MYSQL_INSTANCES_FILE }}"
  when:
    - mysql_otel_targeted
    - item.NR_CLI_MYSQL_INSTANCES_FILE is defined

- name: Assert NR_CLI_MYSQL_INSTANCES_FILE exists in remote host if not found in playbook's environment
  when:
    - mysql_otel_targeted
    - mysql_otel_instances_file is undefined
  ansible.builtin.assert:
    that:
      - ansible_env.NR_CLI_MYSQL_INSTANCES_FILE is defined
    fail_msg: >-
      NR_CLI_MYSQL_INSTANCES_FILE environment variable is not set. It must point to a YAML
      file (already present on the target host) listing the MySQL instance(s) to monitor.

- name: Read NR_CLI_MYSQL_INSTANCES_FILE from remote host environment
  when:
    - mysql_otel_targeted
    - mysql_otel_instances_file is undefined
    - ansible_env.NR_CLI_MYSQL_INSTANCES_FILE is defined
  ansible.builtin.set_fact:
    mysql_otel_instances_file_from_host: "{{ ansible_env.NR_CLI_MYSQL_INSTANCES_FILE }}"

- name: Assert NR_CLI_MYSQL_INSTANCES_FILE is not empty
  when:
    - mysql_otel_targeted
    - mysql_otel_instances_file is undefined
    - mysql_otel_instances_file_from_host is defined
  ansible.builtin.assert:
    that:
      - mysql_otel_instances_file_from_host != ''
    fail_msg: "NR_CLI_MYSQL_INSTANCES_FILE is empty. It must be set under `environment` in the playbook or in the remote host"

# NR_CLI_MYSQL_SECRETS_FILE (required by both nrdot-collector-mysql and
# nrdot-collector-mysql-rds; KEY=VALUE per line, NR_CLI_MYSQL_ADMIN_USER_<i>/
# NR_CLI_MYSQL_ADMIN_PASSWORD_<i> per instance, indexed to the instances file's order)
- name: Read NR_CLI_MYSQL_SECRETS_FILE from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    mysql_otel_secrets_file: "{{ item.NR_CLI_MYSQL_SECRETS_FILE }}"
  when:
    - mysql_otel_targeted
    - item.NR_CLI_MYSQL_SECRETS_FILE is defined
  no_log: true

- name: Assert NR_CLI_MYSQL_SECRETS_FILE exists in remote host if not found in playbook's environment
  when:
    - mysql_otel_targeted
    - mysql_otel_secrets_file is undefined
  ansible.builtin.assert:
    that:
      - ansible_env.NR_CLI_MYSQL_SECRETS_FILE is defined
    fail_msg: >-
      NR_CLI_MYSQL_SECRETS_FILE environment variable is not set. It must point to a
      KEY=VALUE file (already present on the target host) with the per-instance admin
      credentials used once to create the monitoring user.

- name: Read NR_CLI_MYSQL_SECRETS_FILE from remote host environment
  when:
    - mysql_otel_targeted
    - mysql_otel_secrets_file is undefined
    - ansible_env.NR_CLI_MYSQL_SECRETS_FILE is defined
  ansible.builtin.set_fact:
    mysql_otel_secrets_file_from_host: "{{ ansible_env.NR_CLI_MYSQL_SECRETS_FILE }}"
  no_log: true

- name: Assert NR_CLI_MYSQL_SECRETS_FILE is not empty
  when:
    - mysql_otel_targeted
    - mysql_otel_secrets_file is undefined
    - mysql_otel_secrets_file_from_host is defined
  ansible.builtin.assert:
    that:
      - mysql_otel_secrets_file_from_host != ''
    fail_msg: "NR_CLI_MYSQL_SECRETS_FILE is empty. It must be set under `environment` in the playbook or in the remote host"
