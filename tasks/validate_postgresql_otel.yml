---
- name: Determine which postgresql-otel flavor(s) are in scope
  ansible.builtin.set_fact:
    postgresql_otel_selfhosted_targeted: "{{ 'postgresql-otel' in targets }}"
    postgresql_otel_rds_targeted: "{{ 'postgresql-otel-rds' in targets }}"
    postgresql_otel_targeted: "{{ 'postgresql-otel' in targets or 'postgresql-otel-rds' in targets }}"

# NR_CLI_POSTGRES_INSTANCES_FILE (required by both nrdot-collector-postgresql and
# nrdot-collector-postgresql-rds; a YAML file listing every PostgreSQL instance to monitor -
# host/port/login_name/databases per entry. `databases` now lives per-instance here, replacing
# the old global NR_CLI_POSTGRES_DATABASES variable.)
- name: Read NR_CLI_POSTGRES_INSTANCES_FILE from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    postgresql_otel_instances_file: "{{ item.NR_CLI_POSTGRES_INSTANCES_FILE }}"
  when:
    - postgresql_otel_targeted
    - item.NR_CLI_POSTGRES_INSTANCES_FILE is defined

- name: Assert NR_CLI_POSTGRES_INSTANCES_FILE exists in remote host if not found in playbook's environment
  when:
    - postgresql_otel_targeted
    - postgresql_otel_instances_file is undefined
  ansible.builtin.assert:
    that:
      - ansible_env.NR_CLI_POSTGRES_INSTANCES_FILE is defined
    fail_msg: >-
      NR_CLI_POSTGRES_INSTANCES_FILE environment variable is not set. It must point to a YAML
      file (already present on the target host) listing the PostgreSQL instance(s) and
      database(s) to monitor.

- name: Read NR_CLI_POSTGRES_INSTANCES_FILE from remote host environment
  when:
    - postgresql_otel_targeted
    - postgresql_otel_instances_file is undefined
    - ansible_env.NR_CLI_POSTGRES_INSTANCES_FILE is defined
  ansible.builtin.set_fact:
    postgresql_otel_instances_file_from_host: "{{ ansible_env.NR_CLI_POSTGRES_INSTANCES_FILE }}"

- name: Assert NR_CLI_POSTGRES_INSTANCES_FILE is not empty
  when:
    - postgresql_otel_targeted
    - postgresql_otel_instances_file is undefined
    - postgresql_otel_instances_file_from_host is defined
  ansible.builtin.assert:
    that:
      - postgresql_otel_instances_file_from_host != ''
    fail_msg: "NR_CLI_POSTGRES_INSTANCES_FILE is empty. It must be set under `environment` in the playbook or in the remote host"

# NR_CLI_POSTGRES_SECRETS_FILE (required by both nrdot-collector-postgresql and
# nrdot-collector-postgresql-rds; KEY=VALUE per line, NR_CLI_POSTGRES_SUPERUSER_USER_<i>/
# NR_CLI_POSTGRES_SUPERUSER_PASSWORD_<i> per instance, indexed to the instances file's order)
- name: Read NR_CLI_POSTGRES_SECRETS_FILE from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    postgresql_otel_secrets_file: "{{ item.NR_CLI_POSTGRES_SECRETS_FILE }}"
  when:
    - postgresql_otel_targeted
    - item.NR_CLI_POSTGRES_SECRETS_FILE is defined
  no_log: true

- name: Assert NR_CLI_POSTGRES_SECRETS_FILE exists in remote host if not found in playbook's environment
  when:
    - postgresql_otel_targeted
    - postgresql_otel_secrets_file is undefined
  ansible.builtin.assert:
    that:
      - ansible_env.NR_CLI_POSTGRES_SECRETS_FILE is defined
    fail_msg: >-
      NR_CLI_POSTGRES_SECRETS_FILE environment variable is not set. It must point to a
      KEY=VALUE file (already present on the target host) with the per-instance superuser/
      master credentials used once to create the monitoring role.

- name: Read NR_CLI_POSTGRES_SECRETS_FILE from remote host environment
  when:
    - postgresql_otel_targeted
    - postgresql_otel_secrets_file is undefined
    - ansible_env.NR_CLI_POSTGRES_SECRETS_FILE is defined
  ansible.builtin.set_fact:
    postgresql_otel_secrets_file_from_host: "{{ ansible_env.NR_CLI_POSTGRES_SECRETS_FILE }}"
  no_log: true

- name: Assert NR_CLI_POSTGRES_SECRETS_FILE is not empty
  when:
    - postgresql_otel_targeted
    - postgresql_otel_secrets_file is undefined
    - postgresql_otel_secrets_file_from_host is defined
  ansible.builtin.assert:
    that:
      - postgresql_otel_secrets_file_from_host != ''
    fail_msg: "NR_CLI_POSTGRES_SECRETS_FILE is empty. It must be set under `environment` in the playbook or in the remote host"
