---
- name: Determine which mssql-otel flavor(s) are in scope
  ansible.builtin.set_fact:
    mssql_otel_selfhosted_sqlauth_targeted: "{{ 'mssql-otel' in targets }}"
    mssql_otel_rds_sqlauth_targeted: "{{ 'mssql-otel-rds' in targets }}"
    mssql_otel_selfhosted_winauth_targeted: "{{ 'mssql-otel-winauth' in targets }}"
    mssql_otel_rds_winauth_targeted: "{{ 'mssql-otel-rds-winauth' in targets }}"
    mssql_otel_winauth_targeted: "{{ 'mssql-otel-winauth' in targets or 'mssql-otel-rds-winauth' in targets }}"

# NR_CLI_MSSQL_INSTANCES_FILE (required by all four mssql-otel recipes; a YAML file listing
# every SQL Server instance to monitor - host/port/login_name per entry for the SQL-auth
# recipes, host/port only for the winauth recipes. The winauth recipes dropped their old
# single-instance NR_CLI_MSSQL_SERVER/NR_CLI_MSSQL_PORT vars for this with no fallback)
- name: Read NR_CLI_MSSQL_INSTANCES_FILE from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    mssql_otel_instances_file: "{{ item.NR_CLI_MSSQL_INSTANCES_FILE }}"
  when:
    - mssql_otel_selfhosted_sqlauth_targeted or mssql_otel_rds_sqlauth_targeted or mssql_otel_winauth_targeted
    - item.NR_CLI_MSSQL_INSTANCES_FILE is defined

- name: Assert NR_CLI_MSSQL_INSTANCES_FILE exists in remote host if not found in playbook's environment
  when:
    - mssql_otel_selfhosted_sqlauth_targeted or mssql_otel_rds_sqlauth_targeted or mssql_otel_winauth_targeted
    - mssql_otel_instances_file is undefined
  ansible.builtin.assert:
    that:
      - ansible_env.NR_CLI_MSSQL_INSTANCES_FILE is defined
    fail_msg: >-
      NR_CLI_MSSQL_INSTANCES_FILE environment variable is not set. It must point to a YAML
      file (already present on the target host) listing the SQL Server instance(s) to monitor.

- name: Read NR_CLI_MSSQL_INSTANCES_FILE from remote host environment
  when:
    - mssql_otel_selfhosted_sqlauth_targeted or mssql_otel_rds_sqlauth_targeted or mssql_otel_winauth_targeted
    - mssql_otel_instances_file is undefined
    - ansible_env.NR_CLI_MSSQL_INSTANCES_FILE is defined
  ansible.builtin.set_fact:
    mssql_otel_instances_file_from_host: "{{ ansible_env.NR_CLI_MSSQL_INSTANCES_FILE }}"

- name: Assert NR_CLI_MSSQL_INSTANCES_FILE is not empty
  when:
    - mssql_otel_selfhosted_sqlauth_targeted or mssql_otel_rds_sqlauth_targeted or mssql_otel_winauth_targeted
    - mssql_otel_instances_file is undefined
    - mssql_otel_instances_file_from_host is defined
  ansible.builtin.assert:
    that:
      - mssql_otel_instances_file_from_host != ''
    fail_msg: "NR_CLI_MSSQL_INSTANCES_FILE is empty. It must be set under `environment` in the playbook or in the remote host"

# NR_CLI_MSSQL_SECRETS_FILE (required by nrdot-collector-mssql and nrdot-collector-mssql-rds;
# KEY=VALUE per line, NR_CLI_MSSQL_ADMIN_USER_<i>/NR_CLI_MSSQL_ADMIN_PASSWORD_<i> per instance)
- name: Read NR_CLI_MSSQL_SECRETS_FILE from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    mssql_otel_secrets_file: "{{ item.NR_CLI_MSSQL_SECRETS_FILE }}"
  when:
    - mssql_otel_selfhosted_sqlauth_targeted or mssql_otel_rds_sqlauth_targeted
    - item.NR_CLI_MSSQL_SECRETS_FILE is defined
  no_log: true

- name: Assert NR_CLI_MSSQL_SECRETS_FILE exists in remote host if not found in playbook's environment
  when:
    - mssql_otel_selfhosted_sqlauth_targeted or mssql_otel_rds_sqlauth_targeted
    - mssql_otel_secrets_file is undefined
  ansible.builtin.assert:
    that:
      - ansible_env.NR_CLI_MSSQL_SECRETS_FILE is defined
    fail_msg: >-
      NR_CLI_MSSQL_SECRETS_FILE environment variable is not set. It must point to a
      KEY=VALUE file (already present on the target host) with the per-instance admin
      credentials used once to create the monitoring login.

- name: Read NR_CLI_MSSQL_SECRETS_FILE from remote host environment
  when:
    - mssql_otel_selfhosted_sqlauth_targeted or mssql_otel_rds_sqlauth_targeted
    - mssql_otel_secrets_file is undefined
    - ansible_env.NR_CLI_MSSQL_SECRETS_FILE is defined
  ansible.builtin.set_fact:
    mssql_otel_secrets_file_from_host: "{{ ansible_env.NR_CLI_MSSQL_SECRETS_FILE }}"
  no_log: true

- name: Assert NR_CLI_MSSQL_SECRETS_FILE is not empty
  when:
    - mssql_otel_selfhosted_sqlauth_targeted or mssql_otel_rds_sqlauth_targeted
    - mssql_otel_secrets_file is undefined
    - mssql_otel_secrets_file_from_host is defined
  ansible.builtin.assert:
    that:
      - mssql_otel_secrets_file_from_host != ''
    fail_msg: "NR_CLI_MSSQL_SECRETS_FILE is empty. It must be set under `environment` in the playbook or in the remote host"

# NR_CLI_MSSQL_WINAUTH_LOCATION (optional, default "1"; self-hosted winauth only - "1" means
# the collector runs on the same host as SQL Server (no domain identity needed, service stays
# LocalSystem), "2" means a different host (requires NR_CLI_MSSQL_WIN_ACCOUNT/_WIN_PASSWORD).
# The RDS winauth recipe has no location choice - it always needs a domain account.)
- name: Read NR_CLI_MSSQL_WINAUTH_LOCATION from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    mssql_otel_winauth_location: "{{ item.NR_CLI_MSSQL_WINAUTH_LOCATION }}"
  when:
    - mssql_otel_selfhosted_winauth_targeted
    - item.NR_CLI_MSSQL_WINAUTH_LOCATION is defined

- name: Read NR_CLI_MSSQL_WINAUTH_LOCATION from remote host environment
  when:
    - mssql_otel_selfhosted_winauth_targeted
    - mssql_otel_winauth_location is undefined
    - ansible_env.NR_CLI_MSSQL_WINAUTH_LOCATION is defined
  ansible.builtin.set_fact:
    mssql_otel_winauth_location: "{{ ansible_env.NR_CLI_MSSQL_WINAUTH_LOCATION }}"

# NR_CLI_MSSQL_AUTH_MODE (optional, default "1"; only meaningful for the winauth recipes,
# where it selects Windows Domain Auth ("1") vs gMSA ("2"))
- name: Read NR_CLI_MSSQL_AUTH_MODE from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    mssql_otel_auth_mode: "{{ item.NR_CLI_MSSQL_AUTH_MODE }}"
  when:
    - mssql_otel_winauth_targeted
    - item.NR_CLI_MSSQL_AUTH_MODE is defined

- name: Read NR_CLI_MSSQL_AUTH_MODE from remote host environment
  when:
    - mssql_otel_winauth_targeted
    - mssql_otel_auth_mode is undefined
    - ansible_env.NR_CLI_MSSQL_AUTH_MODE is defined
  ansible.builtin.set_fact:
    mssql_otel_auth_mode: "{{ ansible_env.NR_CLI_MSSQL_AUTH_MODE }}"

# NR_CLI_MSSQL_WIN_ACCOUNT / NR_CLI_MSSQL_WIN_PASSWORD (required by the winauth recipes
# when NR_CLI_MSSQL_AUTH_MODE is "1", Windows Domain Auth)
- name: Read NR_CLI_MSSQL_WIN_ACCOUNT from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    mssql_otel_win_account: "{{ item.NR_CLI_MSSQL_WIN_ACCOUNT }}"
  when:
    - mssql_otel_winauth_targeted
    - item.NR_CLI_MSSQL_WIN_ACCOUNT is defined

- name: Read NR_CLI_MSSQL_WIN_ACCOUNT from remote host environment
  when:
    - mssql_otel_winauth_targeted
    - mssql_otel_win_account is undefined
    - ansible_env.NR_CLI_MSSQL_WIN_ACCOUNT is defined
  ansible.builtin.set_fact:
    mssql_otel_win_account: "{{ ansible_env.NR_CLI_MSSQL_WIN_ACCOUNT }}"

- name: Read NR_CLI_MSSQL_WIN_PASSWORD from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    mssql_otel_win_password: "{{ item.NR_CLI_MSSQL_WIN_PASSWORD }}"
  when:
    - mssql_otel_winauth_targeted
    - item.NR_CLI_MSSQL_WIN_PASSWORD is defined
  no_log: true

- name: Read NR_CLI_MSSQL_WIN_PASSWORD from remote host environment
  when:
    - mssql_otel_winauth_targeted
    - mssql_otel_win_password is undefined
    - ansible_env.NR_CLI_MSSQL_WIN_PASSWORD is defined
  ansible.builtin.set_fact:
    mssql_otel_win_password: "{{ ansible_env.NR_CLI_MSSQL_WIN_PASSWORD }}"
  no_log: true

# Required whenever the RDS winauth recipe uses Windows Domain Auth (no location choice there),
# and for self-hosted winauth Windows Domain Auth only when the collector runs on a different
# host than SQL Server (NR_CLI_MSSQL_WINAUTH_LOCATION == "2"); not required for self-hosted
# "same host" (location "1", the default), where the service stays LocalSystem.
- name: Assert Windows Domain Auth credentials are set when NR_CLI_MSSQL_AUTH_MODE is 1
  when:
    - mssql_otel_winauth_targeted
    - (mssql_otel_auth_mode | default('1')) == '1'
    - mssql_otel_rds_winauth_targeted or (mssql_otel_winauth_location | default('1')) == '2'
  ansible.builtin.assert:
    that:
      - mssql_otel_win_account is defined
      - mssql_otel_win_account | trim != ''
      - mssql_otel_win_password is defined
      - mssql_otel_win_password | trim != ''
    fail_msg: >-
      NR_CLI_MSSQL_WIN_ACCOUNT and NR_CLI_MSSQL_WIN_PASSWORD are required when
      NR_CLI_MSSQL_AUTH_MODE is 1 (Windows Domain Auth) for mssql-otel-rds-winauth, or for
      mssql-otel-winauth when NR_CLI_MSSQL_WINAUTH_LOCATION is 2 (different host). Set these
      under `environment` in the playbook or in the remote host.

# NR_CLI_MSSQL_GMSA_ACCOUNT (required by the winauth recipes when NR_CLI_MSSQL_AUTH_MODE is "2", gMSA)
- name: Read NR_CLI_MSSQL_GMSA_ACCOUNT from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    mssql_otel_gmsa_account: "{{ item.NR_CLI_MSSQL_GMSA_ACCOUNT }}"
  when:
    - mssql_otel_winauth_targeted
    - item.NR_CLI_MSSQL_GMSA_ACCOUNT is defined

- name: Read NR_CLI_MSSQL_GMSA_ACCOUNT from remote host environment
  when:
    - mssql_otel_winauth_targeted
    - mssql_otel_gmsa_account is undefined
    - ansible_env.NR_CLI_MSSQL_GMSA_ACCOUNT is defined
  ansible.builtin.set_fact:
    mssql_otel_gmsa_account: "{{ ansible_env.NR_CLI_MSSQL_GMSA_ACCOUNT }}"

- name: Assert gMSA account is set when NR_CLI_MSSQL_AUTH_MODE is 2
  when:
    - mssql_otel_winauth_targeted
    - (mssql_otel_auth_mode | default('1')) == '2'
  ansible.builtin.assert:
    that:
      - mssql_otel_gmsa_account is defined
      - mssql_otel_gmsa_account | trim != ''
    fail_msg: >-
      NR_CLI_MSSQL_GMSA_ACCOUNT is required when NR_CLI_MSSQL_AUTH_MODE is 2 (gMSA).
      Set this under `environment` in the playbook or in the remote host.
