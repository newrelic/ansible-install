- name: Read NR_CLI_MSSQL_SA_PASSWORD from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    mssql_otel_sa_password: "{{ item.NR_CLI_MSSQL_SA_PASSWORD }}"
  when:
    - item.NR_CLI_MSSQL_SA_PASSWORD is defined
  no_log: true

- name: Read NR_CLI_MSSQL_AUTH_MODE from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    mssql_otel_auth_mode: "{{ item.NR_CLI_MSSQL_AUTH_MODE }}"
  when:
    - item.NR_CLI_MSSQL_AUTH_MODE is defined

- name: Read NR_CLI_MSSQL_WIN_ACCOUNT from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    mssql_otel_win_account: "{{ item.NR_CLI_MSSQL_WIN_ACCOUNT }}"
  when:
    - item.NR_CLI_MSSQL_WIN_ACCOUNT is defined

- name: Read NR_CLI_MSSQL_WIN_PASSWORD from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    mssql_otel_win_password: "{{ item.NR_CLI_MSSQL_WIN_PASSWORD }}"
  when:
    - item.NR_CLI_MSSQL_WIN_PASSWORD is defined
  no_log: true

- name: Read NR_CLI_MSSQL_GMSA_ACCOUNT from play environment
  loop: "{{ environment }}"
  ansible.builtin.set_fact:
    mssql_otel_gmsa_account: "{{ item.NR_CLI_MSSQL_GMSA_ACCOUNT }}"
  when:
    - item.NR_CLI_MSSQL_GMSA_ACCOUNT is defined

- name: Assert NR_CLI_MSSQL_SA_PASSWORD is set for SQL Server authentication (default on Linux, mode 1 on Windows)
  when:
    - os_name != 'windows' or (mssql_otel_auth_mode | default('1')) == '1'
  ansible.builtin.assert:
    that:
      - mssql_otel_sa_password is defined
      - mssql_otel_sa_password != ''
    fail_msg: "NR_CLI_MSSQL_SA_PASSWORD is required for the mssql-otel target. Please set this in your play under `environment`"

- name: Assert Windows Auth credentials are set when NR_CLI_MSSQL_AUTH_MODE is 2
  when:
    - os_name == 'windows'
    - (mssql_otel_auth_mode | default('1')) == '2'
  ansible.builtin.assert:
    that:
      - mssql_otel_win_account is defined
      - mssql_otel_win_account != ''
      - mssql_otel_win_password is defined
      - mssql_otel_win_password != ''
    fail_msg: "NR_CLI_MSSQL_WIN_ACCOUNT and NR_CLI_MSSQL_WIN_PASSWORD are required for the mssql-otel target when NR_CLI_MSSQL_AUTH_MODE is 2 (Windows Auth)"

- name: Assert gMSA account is set when NR_CLI_MSSQL_AUTH_MODE is 3
  when:
    - os_name == 'windows'
    - (mssql_otel_auth_mode | default('1')) == '3'
  ansible.builtin.assert:
    that:
      - mssql_otel_gmsa_account is defined
      - mssql_otel_gmsa_account != ''
    fail_msg: "NR_CLI_MSSQL_GMSA_ACCOUNT is required for the mssql-otel target when NR_CLI_MSSQL_AUTH_MODE is 3 (gMSA)"
