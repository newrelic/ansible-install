---
# Manual Galaxy re-import — backup in case the Galaxy publish step in the
# release workflow needs to be re-triggered in isolation.
#
# Previously triggered on every push to main, which caused Galaxy to re-import
# the role after every commit — unnecessary churn. Now workflow_dispatch only.
# Normal releases run the full pipeline via release.yml.
name: Galaxy Import

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  galaxy-import:
    runs-on: ubuntu-latest
    name: "🌌 Re-import: Push Role to Ansible Galaxy"
    steps:
      - name: "📦 Checkout: Fetch Repository"
        uses: actions/checkout@v4

      - name: "🌌 Publish: Import Role to Ansible Galaxy"
        uses: robertdebock/galaxy-action@1.2.1
        with:
          galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}
          git_branch: main
